# Pathfinder judge registry. Verdict rows cite judges as
# "claude:<model_id>" using the model_id recorded here, which is the exact
# identifier confirmed by a dry-run, not merely the requested alias.

prompt_version: v2   # v2 2026-06-12: corr anchor broadened to include
                     # composition (Q's technique incorporated into P's
                     # workload on the same hardware); v1 verdicts retained
                     # in pair rows for instrument comparison.
registered: "2026-06-12"

dry_run:
  date: "2026-06-12"
  method: >
    claude --model <alias> --print --output-format text
    -p "State the exact model ID from your system prompt. Output only the
    model ID string, nothing else."

judges:
  cheap:
    alias: claude-haiku-4-5
    model_id: claude-haiku-4-5   # dry-run confirmed 2026-06-12
    tier: cheap
    transport: claude-cli        # batch API deferred; CLI suffices at calibration scale
    provider: anthropic
    prompt_file: judge_prompt_v2.md
    output_contract: v2
    settings: {}
  strong:
    alias: claude-opus-4-8
    model_id: claude-opus-4-8    # dry-run confirmed 2026-06-12
    tier: strong
    transport: claude-cli
    provider: anthropic
    prompt_file: judge_prompt_v2.md
    output_contract: v2
    settings: {}
  cheap_sonnet:
    # Escalation candidate for the cheap tier (escalation rule below). Run on
    # the calibration set only, same prompt v2, scored against the same Opus
    # strong reference, to measure whether Sonnet buys a better recall/volume
    # tradeoff than Haiku. Verdicts carry tier 'cheap_candidate' so they stay
    # distinct from the deployed Haiku cheap judge and from the strong tier.
    alias: claude-sonnet-4-6
    model_id: claude-sonnet-4-6  # dry-run confirmed 2026-06-12
    tier: cheap_candidate
    transport: claude-cli
    provider: anthropic
    prompt_file: judge_prompt_v2.md
    output_contract: v2
    settings: {}

  opus5:
    # Phase A strong judge.
    #
    # transport is claude-cli, NOT pi: on 2026-07-26 a live probe found
    # pi's anthropic provider refused outright on a Max subscription with
    # 400 "Third-party apps now draw from your extra usage, not your plan
    # limits" and zero tokens consumed. The claude CLI is first-party and
    # draws on the plan (its json response reports provider firstParty).
    alias: claude-opus-5
    model_id: claude-opus-5
    tier: strong
    transport: claude-cli
    provider: anthropic
    prompt_file: judge_prompt_v3.md
    output_contract: v2
    settings: {effort: xhigh}
  gpt56:
    # Phase A strong judge, second vendor. Independent rate limits are the
    # point: a closed tap on one side must not idle the other.
    #
    # Dry run 2026-07-26: the model answers "unavailable" when asked to
    # state its own ID, so unlike the Claude judges there is NO model
    # self-attestation here. The only identity evidence is the transport
    # echo (pi reports model: gpt-5.6-sol, responseModel: null). Treat the
    # recorded model_id as the requested id, not a confirmed one.
    alias: gpt-5.6-sol
    model_id: gpt-5.6-sol
    tier: strong
    transport: pi
    provider: openai-codex
    prompt_file: judge_prompt_v3.md
    output_contract: v2
    settings: {effort: xhigh}

  opus5_fg:
    # Feasibility/gain instrument. v4 replaces the corr/int axes, which the
    # completed sweep showed the judges collapse into one (Spearman +0.974),
    # with two the judges hold apart by construction: could the implied
    # experiment be run, and would its outcome teach anything.
    #
    # Scores are integers 0-100, giving ~100 usable levels against v2's ~20 -
    # the coarse grid left Opus with only 14 distinct values across its own
    # top 100, so any ranking inside a shortlist was mostly tie-break.
    #
    # AXIS MAPPING: feasibility is stored in `corr`, gain in `int`, each
    # divided by 100. verdicts.schema.json fixes those field names and bounds
    # them to [0,1]. Read a v4 series accordingly.
    #
    # WORDING REVISED 2026-07-27. The first v4 text (prompt sha256
    # db111b02a6b9..., instruments 425d1c378968 for Opus and 60ed46389e21 for
    # GPT, 1,003 verdicts each) said "do not round to multiples of five". Both
    # judges obeyed it absolutely: zero of 1,003 scores were multiples of
    # five, so 21 of the 101 available values were unreachable. The revision
    # asks for the same thing it meant -- do not snap to a round number
    # because it looks tidy -- without forbidding the values. New prompt
    # hash, so the runner registers a new instrument and the earlier series
    # stays intact rather than being extended under a different rule.
    alias: claude-opus-5
    model_id: claude-opus-5
    tier: strong
    transport: claude-cli
    provider: anthropic
    prompt_file: judge_prompt_v4.md
    output_contract: v4
    settings: {effort: xhigh}
  gpt56_fg:
    # Second vendor, same v4 instrument. See opus5_fg for the axis mapping.
    alias: gpt-5.6-sol
    model_id: gpt-5.6-sol
    tier: strong
    transport: pi
    provider: openai-codex
    prompt_file: judge_prompt_v4.md
    output_contract: v4
    settings: {effort: xhigh}


# Escalation rule (plan item 2): if the cheap judge cannot offer a useful
# tradeoff between strong-model recall and strong-pass volume, either
# promote the cheap tier to claude-sonnet-4-6 and re-measure, or accept that
# Phase 1 forwards a large survivor set to the strong tier. Prompt edits and
# judge swaps never happen in the same step.
escalation:
  cheap_fallback_alias: claude-sonnet-4-6
