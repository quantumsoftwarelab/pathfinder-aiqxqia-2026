# Pathfinder judge registry. Verdict rows cite judges as
# "claude:<model_id>" using the model_id recorded here, which is the exact
# identifier confirmed by a dry-run, not merely the requested alias.

prompt_version: v2   # v2 2026-06-12: corr anchor broadened to include
                     # composition (Q's technique incorporated into P's
                     # workload on the same hardware); v1 verdicts retained
                     # in pair rows for instrument comparison.
registered: "2026-06-12"

dry_run:
  date: "2026-06-12"
  method: >
    claude --model <alias> --print --output-format text
    -p "State the exact model ID from your system prompt. Output only the
    model ID string, nothing else."

judges:
  cheap:
    alias: claude-haiku-4-5
    model_id: claude-haiku-4-5   # dry-run confirmed 2026-06-12
    tier: cheap
    transport: claude-cli        # batch API deferred; CLI suffices at calibration scale
    provider: anthropic
    prompt_file: judge_prompt_v2.md
    output_contract: v2
    settings: {}
  strong:
    alias: claude-opus-4-8
    model_id: claude-opus-4-8    # dry-run confirmed 2026-06-12
    tier: strong
    transport: claude-cli
    provider: anthropic
    prompt_file: judge_prompt_v2.md
    output_contract: v2
    settings: {}
  cheap_sonnet:
    # Escalation candidate for the cheap tier (escalation rule below). Run on
    # the calibration set only, same prompt v2, scored against the same Opus
    # strong reference, to measure whether Sonnet buys a better recall/volume
    # tradeoff than Haiku. Verdicts carry tier 'cheap_candidate' so they stay
    # distinct from the deployed Haiku cheap judge and from the strong tier.
    alias: claude-sonnet-4-6
    model_id: claude-sonnet-4-6  # dry-run confirmed 2026-06-12
    tier: cheap_candidate
    transport: claude-cli
    provider: anthropic
    prompt_file: judge_prompt_v2.md
    output_contract: v2
    settings: {}

  opus5:
    # Phase A strong judge.
    #
    # transport is claude-cli, NOT pi: on 2026-07-26 a live probe found
    # pi's anthropic provider refused outright on a Max subscription with
    # 400 "Third-party apps now draw from your extra usage, not your plan
    # limits" and zero tokens consumed. The claude CLI is first-party and
    # draws on the plan (its json response reports provider firstParty).
    alias: claude-opus-5
    model_id: claude-opus-5
    tier: strong
    transport: claude-cli
    provider: anthropic
    prompt_file: judge_prompt_v3.md
    output_contract: v2
    settings: {effort: xhigh}
  gpt56:
    # Phase A strong judge, second vendor. Independent rate limits are the
    # point: a closed tap on one side must not idle the other.
    #
    # Dry run 2026-07-26: the model answers "unavailable" when asked to
    # state its own ID, so unlike the Claude judges there is NO model
    # self-attestation here. The only identity evidence is the transport
    # echo (pi reports model: gpt-5.6-sol, responseModel: null). Treat the
    # recorded model_id as the requested id, not a confirmed one.
    alias: gpt-5.6-sol
    model_id: gpt-5.6-sol
    tier: strong
    transport: pi
    provider: openai-codex
    prompt_file: judge_prompt_v3.md
    output_contract: v2
    settings: {effort: xhigh}

  opus5_fg:
    # Feasibility/gain instrument. v4 replaces the corr/int axes, which the
    # completed sweep showed the judges collapse into one (Spearman +0.974),
    # with two the judges hold apart by construction: could the implied
    # experiment be run, and would its outcome teach anything.
    #
    # Scores are integers 0-100, giving ~100 usable levels against v2's ~20 -
    # the coarse grid left Opus with only 14 distinct values across its own
    # top 100, so any ranking inside a shortlist was mostly tie-break.
    #
    # AXIS MAPPING: feasibility is stored in `corr`, gain in `int`, each
    # divided by 100. verdicts.schema.json fixes those field names and bounds
    # them to [0,1]. Read a v4 or v5 series accordingly.
    #
    # v5 SUPERSEDES v4, 2026-07-27. judge_prompt_v4.md (sha256
    # db111b02a6b9..., instruments 425d1c378968 Opus / 60ed46389e21 GPT,
    # 1,003 verdicts each) said "do not round to multiples of five". Both
    # judges obeyed it absolutely: zero of 1,003 scores were multiples of
    # five, so 21 of the 101 available values were unreachable.
    # judge_prompt_v5.md (sha256 2fe11bc807ad..., instruments b99996c890be
    # Opus / d19bb7d063eb GPT) asks for what that meant -- do not snap to a
    # round number because it looks tidy -- while leaving the values in play.
    # v4 is kept unmodified beside it so both series remain readable.
    #
    # The v5 file's own heading still reads "prompt v4". That is deliberate:
    # instrument_id hashes the file's bytes, so editing the heading would
    # mint a third instrument and orphan the verdicts already judged under
    # this text. The filename is free to change; the contents are not.
    alias: claude-opus-5
    model_id: claude-opus-5
    tier: strong
    transport: claude-cli
    provider: anthropic
    prompt_file: judge_prompt_v5.md
    # output_contract names the OUTPUT SHAPE, not the prompt: the keys
    # feasibility/gain/rationale, introduced with v4 and unchanged by v5.
    # Its hash covers the key set alone, so both prompts share it.
    output_contract: v4
    settings: {effort: xhigh}
  gpt56_fg:
    # Second vendor, same v5 instrument. See opus5_fg for the axis mapping.
    alias: gpt-5.6-sol
    model_id: gpt-5.6-sol
    tier: strong
    transport: pi
    provider: openai-codex
    prompt_file: judge_prompt_v5.md
    output_contract: v4
    settings: {effort: xhigh}

  opus5_v6:
    # v6 instrument. NOT a refinement of v5: v5 scores a pairing through an
    # experiment's result, so a pair whose value is a gap, an unmet assumption
    # or a missing guarantee has nowhere to land. Observed on the founding
    # pairings of pathfinder/revealing_examples.md, which v5 scores at
    # gain 44/48 (prover / HRL silicon) and 30/47 (blind delegation / IonQ
    # clinical) while holding the clean stress case at 82/86: both judges
    # constructed a strained experiment rather than scoring what the pairing
    # establishes.
    #
    # AXIS MAPPING: unchanged from v4/v5. feasibility -> corr, gain -> int,
    # each divided by 100, because verdicts.schema.json fixes those names and
    # bounds them to [0,1].
    #
    # NOT COMMENSURABLE. v6 scores feasibility in both cases, but it measures
    # different work in each: "could the experiment be run today" when
    # yield_kind is "experiment", "what would it take to establish the
    # connection" otherwise. A corr of 0.85 therefore means one thing or the
    # other depending on yield_kind. Ranking the populations on one
    # threshold compares unlike quantities; decide joint or separate ranking
    # explicitly before any shortlist is cut from a v6 series.
    #
    # Same judges, same models, same transports and same effort as the v5
    # series, per the standing rule below that prompt edits and judge swaps
    # never happen in the same step. The v5 files are kept unmodified beside
    # v6 so both series remain readable.
    alias: claude-opus-5
    model_id: claude-opus-5
    tier: strong
    transport: claude-cli
    provider: anthropic
    prompt_file: judge_prompt_v6.md
    # New contract: v4's key set has no room for yield_kind, and the
    # contract hash enters the instrument identity.
    output_contract: v6
    settings: {effort: xhigh}
  gpt56_v6:
    # Second vendor, same v6 instrument. See opus5_v6 for the axis mapping and
    # the commensurability warning.
    alias: gpt-5.6-sol
    model_id: gpt-5.6-sol
    tier: strong
    transport: pi
    provider: openai-codex
    prompt_file: judge_prompt_v6.md
    output_contract: v6
    settings: {effort: xhigh}


# Escalation rule (plan item 2): if the cheap judge cannot offer a useful
# tradeoff between strong-model recall and strong-pass volume, either
# promote the cheap tier to claude-sonnet-4-6 and re-measure, or accept that
# Phase 1 forwards a large survivor set to the strong tier. Prompt edits and
# judge swaps never happen in the same step.
escalation:
  cheap_fallback_alias: claude-sonnet-4-6
